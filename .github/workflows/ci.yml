name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Checkout pinned Heart integration fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kirigayakazima/dsh-heart
          ref: 77a7a678392be82bf69b0d66a9bb0d8f71272475
          path: .test-integrations/heart
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Report filesystem path API compatibility
        run: node --input-type=module -e "import fs from 'node:fs'; import os from 'node:os'; const p=os.tmpdir(); console.log(JSON.stringify({sync:fs.realpathSync(p),native:fs.realpathSync.native(p),async:await fs.promises.realpath(p)}));"
      - run: npm test
        env:
          DSH_HEART_ROOT: ${{ github.workspace }}/.test-integrations/heart
      - run: npm pack --dry-run
